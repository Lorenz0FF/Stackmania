# Stackmania CodeQL security scan.
# Runs static analysis on the Java sources to surface common security and
# quality issues (injection, deserialization, path traversal, etc.). Results
# appear in the Security tab of the repo.

name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Sundays at 06:30 UTC — once a week is enough for a slow-moving server fork.
    - cron: '30 6 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # gradleutils.gitInfo prefers full history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          # `security-and-quality` adds maintainability checks on top of the
          # default security suite. Cheap and we want both.
          queries: security-and-quality

      # Stackmania needs the full ForgeGradle MCP pipeline before its Java
      # source set is even available — without `setup` the compileJava step
      # has nothing to analyze. Reusing the same gradlew calls as the regular
      # CI workflow.
      - name: Gradle setup + compile
        run: |
          chmod +x ./gradlew
          ./gradlew setup --stacktrace
          ./gradlew :stackmania:compileJava --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

# Stackmania release workflow.
# Triggers on tags matching stackmania-* or v*, builds the server jar,
# and publishes a GitHub Release with the jar attached + a changelog
# generated from the commits since the previous tag.

name: Release on tag

on:
  push:
    tags:
      - 'stackmania-*'
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for git log + gradleutils.gitInfo

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build server jar
        run: |
          chmod +x ./gradlew
          ./gradlew setup packageLibraries --stacktrace
          ./gradlew stackmaniaJar --stacktrace

      - name: Resolve tag context
        id: tags
        run: |
          CURRENT="${GITHUB_REF_NAME}"
          PREVIOUS=$(git describe --tags --abbrev=0 "${CURRENT}^" 2>/dev/null || true)
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${CURRENT} (previous: ${PREVIOUS:-none})"

      - name: Generate release notes
        run: |
          {
            echo "## Changes"
            echo ""
            if [ -n "${{ steps.tags.outputs.previous }}" ]; then
              echo "Since [\`${{ steps.tags.outputs.previous }}\`](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tags.outputs.previous }}):"
              echo ""
              git log "${{ steps.tags.outputs.previous }}..${{ steps.tags.outputs.current }}" --pretty=format:'- %s (%h)' --reverse
            else
              echo "Initial release. Most recent commits:"
              echo ""
              git log "${{ steps.tags.outputs.current }}" --pretty=format:'- %s (%h)' --reverse | tail -50
            fi
            echo ""
            echo ""
            echo "## Build info"
            echo ""
            echo "- Minecraft: 1.20.1"
            echo "- Forge: 47.4.13"
            echo "- Java: 17"
            echo "- Built from commit: \`${{ github.sha }}\`"
          } > release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tags.outputs.current }}" \
            --title "${{ steps.tags.outputs.current }}" \
            --notes-file release-notes.md \
            projects/stackmania/build/libs/*-server.jar

# Stackmania CI — Java build with Gradle
# Triggers on main and optimization/feature branches; manual dispatch supported.

name: Java CI with Gradle

on:
  push:
    branches: [ "main", "optim-*", "feat-*", "fix-*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # gradleutils.gitInfo needs full history for abbreviatedId/tag

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Gradle setup + packageLibraries
      run: |
        chmod +x ./gradlew
        ./gradlew setup packageLibraries --stacktrace

    - name: Build stackmaniaJar
      run: ./gradlew stackmaniaJar --stacktrace

    - name: Upload server jar
      uses: actions/upload-artifact@v4
      with:
        name: Stackmania-1.20.1-server
        path: projects/stackmania/build/libs/*-server.jar
        retention-days: 30
